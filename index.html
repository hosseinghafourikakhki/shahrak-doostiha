<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهرک دوستی‌ها</title>
<style>
  :root{ --green:#2e7d32; --green2:#66bb6a; --yellow:#ffca28; --orange:#ff8f00; --pink:#ec407a; --purple:#8e24aa; --blue:#29b6f6; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Vazirmatn","Vazir","Tahoma","Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",sans-serif;
    background:linear-gradient(180deg,#b3e5fc 0%,#e1f5fe 38%,#c5e1a5 100%);
    background-attachment:fixed; color:var(--green);
    min-height:100vh; min-height:100dvh; overflow-x:hidden; direction:rtl; text-align:center;
  }
  .screen{display:none; min-height:100vh; min-height:100dvh; flex-direction:column; align-items:center; justify-content:center; padding:14px; gap:12px;}
  .screen.active{display:flex;}

  /* ---------- گرافیک شهرک ---------- */
  .town{width:min(96vw,640px); filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));}
  .town svg{width:100%; height:auto; display:block; border-radius:28px; border:6px solid #fff;}
  .cloud{animation:drift 12s ease-in-out infinite alternate;}
  .cloud.c2{animation-duration:17s; animation-direction:alternate-reverse;}
  @keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
  .spin{transform-box:fill-box; transform-origin:center; animation:spin 24s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .twinkle{animation:twinkle 1.6s ease-in-out infinite;}
  .twinkle.t2{animation-delay:.5s;} .twinkle.t3{animation-delay:1s;}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .boom{transform-box:fill-box; transform-origin:center; animation:boom 1.8s ease-out infinite;}
  .boom.b2{animation-delay:.9s;}
  @keyframes boom{0%{transform:scale(.2);opacity:1}80%{opacity:1}100%{transform:scale(1.2);opacity:0}}
  .sway{transform-box:fill-box; transform-origin:bottom center; animation:sway 3s ease-in-out infinite alternate;}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

  .pulse{transform-box:fill-box; transform-origin:center; animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:.8}50%{transform:scale(1.12); opacity:1}}
  .smoke{transform-box:fill-box; transform-origin:center; opacity:0; animation:rise 3.3s ease-out infinite;}
  @keyframes rise{0%{opacity:.85; transform:translate(0,0) scale(.6)}100%{opacity:0; transform:translate(10px,-34px) scale(1.9)}}
  .fly{animation:flyx 18s linear infinite;}
  .fly.f2{animation-duration:26s; animation-delay:-9s;}
  @keyframes flyx{from{transform:translateX(-60px)}to{transform:translateX(680px)}}
  .flutter{animation:flutter 3.2s ease-in-out infinite;}
  .flutter.f2{animation-delay:-1.4s;}
  @keyframes flutter{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(4px,-20px)}75%{transform:translate(-10px,-8px)}}
  .bob{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .wave{transform-box:fill-box; transform-origin:bottom center; animation:wave .9s ease-in-out infinite alternate;}
  @keyframes wave{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  .swing{transform-box:fill-box; transform-origin:top center; animation:swing 2.2s ease-in-out infinite alternate;}
  @keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  .glow{animation:glow 2s ease-in-out infinite;}
  @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
  .boom.b3{animation-delay:.45s;}

  /* ---------- صفحه آغازین ---------- */
  #start h1{margin:4px 0 0; font-size:clamp(2.2rem,9vw,3.4rem); color:var(--purple); line-height:1.5; text-shadow:0 3px 0 #fff, 0 6px 0 rgba(0,0,0,.08);}
  .btn-big{
    font-family:inherit; font-size:clamp(1.8rem,7vw,2.6rem); font-weight:bold; color:#fff; border:none; cursor:pointer;
    padding:16px 52px; border-radius:999px; background:linear-gradient(180deg,#ffd54f,#ff8f00);
    box-shadow:0 8px 0 #c25e00, 0 14px 22px rgba(0,0,0,.25); animation:bounce 1.6s ease-in-out infinite; transition:transform .1s;
  }
  .btn-big:active{transform:translateY(6px); box-shadow:0 2px 0 #c25e00;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  #start{position:relative;}
  .credit{
    position:absolute; top:10px; right:10px; z-index:5;
    display:flex; align-items:center; justify-content:center; gap:6px; padding:4px 12px;
    background:linear-gradient(180deg,#fffde7,#fff3c4); border:3px dashed var(--pink); border-radius:16px;
    box-shadow:0 0 0 3px #fff, 0 4px 0 rgba(0,0,0,.12); max-width:62vw;
  }
  .credit small{display:block; font-size:.7rem; color:var(--purple); font-weight:bold; line-height:1.3;}
  .credit b{display:block; font-size:clamp(.85rem,3.4vw,1.05rem); color:#e65100; line-height:1.4;}
  .credit-star{font-size:.95rem; animation:twinkle 1.6s ease-in-out infinite;}
  .credit-star:last-child{animation-delay:.8s;}

  /* ---------- صفحه بازی ---------- */
  #game{justify-content:flex-start; max-width:720px; margin:0 auto; width:100%; padding-top:12px;}
  .stats{display:flex; gap:8px; width:100%; justify-content:space-between;}
  .pill{flex:1; background:#fff; border-radius:18px; padding:6px 4px; font-weight:bold; font-size:clamp(.85rem,3.4vw,1.1rem); box-shadow:0 4px 0 rgba(0,0,0,.12); border:3px solid var(--green2);}
  .pill span{display:block; font-size:clamp(1.1rem,4.6vw,1.6rem); color:var(--orange);}
  .progress{position:relative; width:100%; height:22px; background:#fff; border-radius:999px; border:3px solid var(--green2); overflow:hidden;}
  .progress i{display:block; height:100%; width:0; background:linear-gradient(90deg,#9ccc65,#ffca28,#ff8f00,#ec407a); border-radius:999px; transition:width .5s ease;}
  .prompt{font-size:clamp(1.2rem,5vw,1.8rem); font-weight:bold; color:var(--green); margin:4px 0 0; line-height:1.7;}
  .card{
    position:relative; overflow:hidden; width:min(76vw,300px); aspect-ratio:1/1; background:#fff; border-radius:32px;
    border:6px solid var(--yellow); box-shadow:0 10px 0 rgba(0,0,0,.12);
    display:flex; align-items:center; justify-content:center;
  }
  .card .pic{position:relative; z-index:2;}
  .card .emoji{font-size:clamp(6rem,30vw,10rem); line-height:1; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
  .card svg.pic{width:84%; height:84%;}
  .card.pop{animation:pop .6s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1)}}
  .fx{position:absolute; top:-12%; z-index:1; animation:fall linear infinite; pointer-events:none;}
  @keyframes fall{to{top:104%}}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; margin-top:4px;}
  .opt{
    font-family:inherit; font-weight:bold; font-size:clamp(2.6rem,12vw,4rem); line-height:1.5;
    min-height:96px; border:none; border-radius:26px; cursor:pointer; color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.25); transition:transform .1s;
  }
  .opt:nth-child(1){background:#42a5f5;} .opt:nth-child(2){background:#ab47bc;}
  .opt:nth-child(3){background:#ef6c00;} .opt:nth-child(4){background:#26a69a;}
  .opt:active{transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .opt.wrong{background:#b0bec5 !important; box-shadow:none; transform:translateY(6px); animation:shake .4s; cursor:default;}
  .opt.right{background:#43a047 !important; animation:pop .6s;}
  @keyframes shake{0%,100%{transform:translateX(0) translateY(6px)}25%{transform:translateX(-10px) translateY(6px)}75%{transform:translateX(10px) translateY(6px)}}
  .msg{min-height:2.6rem; font-size:clamp(1.3rem,5.4vw,1.9rem); font-weight:bold; margin:0;}
  .msg.good{color:#2e7d32;} .msg.bad{color:#e65100;}
  .spark{position:absolute; z-index:3; font-size:2.2rem; pointer-events:none; animation:fly 1.1s ease-out forwards;}
  @keyframes fly{0%{opacity:1; transform:translate(0,0) scale(.4)}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(200deg)}}

  /* ---------- صفحه پایان ---------- */
  #end{gap:10px;}
  #end h2{font-size:clamp(2rem,8vw,3rem); margin:0; color:var(--purple); text-shadow:0 3px 0 #fff;}
  #end .box{background:#fff; border-radius:28px; border:6px solid var(--yellow); padding:12px 28px; font-size:clamp(1.3rem,5.4vw,1.9rem); font-weight:bold; line-height:2; box-shadow:0 8px 0 rgba(0,0,0,.12);}
  #end .box b{color:var(--orange);}
  #endMsg{font-size:clamp(1.2rem,5vw,1.8rem); font-weight:bold; color:#e65100; margin:0; max-width:520px; line-height:1.8;}
  .confetti{position:fixed; top:-30px; width:12px; height:18px; z-index:50; pointer-events:none; animation:cfall linear forwards;}
  @keyframes cfall{to{transform:translateY(110vh) rotate(720deg);}}
</style>
</head>
<body>

<section id="start" class="screen active">
  <div class="town" id="townStart"></div>
  <h1>شهرک دوستی‌ها</h1>
  <button class="btn-big" id="startBtn" type="button">شروع بازی</button>
  <div class="credit"><span class="credit-star">⭐</span><div><small>طراح</small><b>حسین غفوری کاخکی</b></div><span class="credit-star">⭐</span></div>
</section>

<section id="game" class="screen">
  <div class="stats">
    <div class="pill">سؤال<span id="qNum">۱ / ۱۸</span></div>
    <div class="pill">پاسخ صحیح<span id="correctNum">۰</span></div>
    <div class="pill">امتیاز<span id="scoreNum">۰</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <p class="prompt">نام این تصویر با کدام ترکیب شروع می‌شود؟</p>
  <div class="card" id="card" role="img" aria-label="تصویر"></div>
  <div class="options" id="options"></div>
  <p class="msg" id="msg"></p>
</section>

<section id="end" class="screen">
  <div class="town" id="townEnd"></div>
  <h2>آفرین دوست کوچولو!</h2>
  <div class="box">
    پاسخ‌های صحیح: <b id="finalCorrect"></b><br>
    امتیاز نهایی: <b id="finalScore"></b>
  </div>
  <p id="endMsg"></p>
  <button class="btn-big" id="againBtn" type="button">دوباره بازی کن</button>
</section>

<script>
(function(){
  "use strict";

  /*DATA_START*/
  // ترکیب‌ها (دقیقاً به همان شکل درخواست‌شده)
  var COMBOS = ["با", "بَـ", "دا", "دَ", "ما", "مَـ"];

  // تصویرهای کارتونی اختصاصی (SVG)
  var SVG_ALMOND =
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="gAl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2b07a"/><stop offset="1" stop-color="#a8692d"/></linearGradient></defs>' +
    '<g transform="translate(62 108) rotate(-28)"><path d="M0 -62 C34 -28 44 22 22 58 C10 76 -10 76 -22 58 C-44 22 -34 -28 0 -62 Z" fill="url(#gAl)" stroke="#7b4a1e" stroke-width="4"/>' +
    '<path d="M-14 -20 Q-4 6 -10 40 M6 -30 Q16 0 10 44 M-24 10 Q-18 30 -14 48" stroke="#8d5524" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>' +
    '<ellipse cx="-12" cy="-28" rx="6" ry="14" fill="#fff" opacity=".35" transform="rotate(14)"/></g>' +
    '<g transform="translate(134 100) rotate(24) scale(.92)"><path d="M0 -62 C34 -28 44 22 22 58 C10 76 -10 76 -22 58 C-44 22 -34 -28 0 -62 Z" fill="url(#gAl)" stroke="#7b4a1e" stroke-width="4"/>' +
    '<path d="M-14 -20 Q-4 6 -10 40 M6 -30 Q16 0 10 44 M-24 10 Q-18 30 -14 48" stroke="#8d5524" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>' +
    '<ellipse cx="-12" cy="-28" rx="6" ry="14" fill="#fff" opacity=".35" transform="rotate(14)"/></g>' +
    '<g transform="translate(100 168) rotate(-80) scale(.55)"><path d="M0 -62 C34 -28 44 22 22 58 C10 76 -10 76 -22 58 C-44 22 -34 -28 0 -62 Z" fill="#fff3d6" stroke="#d9b98a" stroke-width="5"/>' +
    '<path d="M0 -40 Q8 0 0 44" stroke="#e6cfa4" stroke-width="4" fill="none"/></g></svg>';

  var SVG_MEDICINE =
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="52" y="74" width="78" height="100" rx="16" fill="#f39c12" stroke="#b9770e" stroke-width="4"/>' +
    '<rect x="68" y="56" width="46" height="24" rx="6" fill="#e67e22" stroke="#b9770e" stroke-width="4"/>' +
    '<rect x="62" y="30" width="58" height="30" rx="9" fill="#fff" stroke="#90a4ae" stroke-width="4"/>' +
    '<rect x="62" y="96" width="68" height="56" rx="8" fill="#fff"/>' +
    '<rect x="88" y="104" width="16" height="40" rx="3" fill="#e53935"/><rect x="76" y="116" width="40" height="16" rx="3" fill="#e53935"/>' +
    '<g transform="translate(150 150) rotate(-35)"><rect x="-22" y="-10" width="44" height="20" rx="10" fill="#fff" stroke="#90a4ae" stroke-width="3"/><path d="M0 -10 H12 a10 10 0 0 1 10 10 a10 10 0 0 1 -10 10 H0 Z" fill="#ef5350"/></g>' +
    '<g transform="translate(156 112) rotate(30)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#fff" stroke="#90a4ae" stroke-width="3"/><path d="M0 -9 H11 a9 9 0 0 1 9 9 a9 9 0 0 1 -9 9 H0 Z" fill="#42a5f5"/></g>' +
    '<ellipse cx="78" cy="88" rx="6" ry="14" fill="#fff" opacity=".4"/></svg>';

  var SVG_SKIRT =
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M62 52 L138 52 L182 168 Q100 190 18 168 Z" fill="#ec407a" stroke="#ad1457" stroke-width="4" stroke-linejoin="round"/>' +
    '<path d="M82 54 L58 176 M100 54 V184 M118 54 L142 176" stroke="#c2185b" stroke-width="3.5" fill="none" opacity=".6"/>' +
    '<path d="M22 160 Q100 184 178 160 L182 168 Q100 190 18 168 Z" fill="#f8bbd0"/>' +
    '<rect x="56" y="36" width="88" height="20" rx="9" fill="#8e24aa" stroke="#6a1b9a" stroke-width="4"/>' +
    '<g fill="#fff" opacity=".85"><circle cx="76" cy="96" r="5"/><circle cx="124" cy="96" r="5"/><circle cx="100" cy="122" r="5"/><circle cx="62" cy="138" r="5"/><circle cx="138" cy="138" r="5"/><circle cx="100" cy="158" r="5"/></g>' +
    '<path d="M100 36 L84 18 L84 42 Z M100 36 L116 18 L116 42 Z" fill="#ffca28" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="36" r="6" fill="#ffb300"/></svg>';

  var SVG_FLY =
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
    '<g stroke="#263238" stroke-width="4" stroke-linecap="round" fill="none"><path d="M82 108 L56 126 L50 150 M118 108 L144 126 L150 150 M84 124 L62 150 M116 124 L138 150 M88 96 L64 88 M112 96 L136 88"/></g>' +
    '<ellipse cx="62" cy="86" rx="40" ry="20" fill="#b3e5fc" opacity=".7" stroke="#4fc3f7" stroke-width="3" transform="rotate(-28 62 86)"/>' +
    '<ellipse cx="138" cy="86" rx="40" ry="20" fill="#b3e5fc" opacity=".7" stroke="#4fc3f7" stroke-width="3" transform="rotate(28 138 86)"/>' +
    '<ellipse cx="100" cy="118" rx="24" ry="40" fill="#37474f" stroke="#263238" stroke-width="4"/>' +
    '<path d="M80 108 Q100 118 120 108 M78 128 Q100 138 122 128" stroke="#607d8b" stroke-width="4" fill="none"/>' +
    '<circle cx="100" cy="68" r="19" fill="#455a64" stroke="#263238" stroke-width="4"/>' +
    '<circle cx="88" cy="62" r="10" fill="#e53935" stroke="#b71c1c" stroke-width="2"/><circle cx="112" cy="62" r="10" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>' +
    '<circle cx="85" cy="59" r="3" fill="#fff"/><circle cx="109" cy="59" r="3" fill="#fff"/>' +
    '<path d="M94 80 Q100 92 106 80" stroke="#263238" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';

  function emo(c, fx){ return {t:"emoji", v:c, fx:fx || ""}; }
  function svg(s){ return {t:"svg", v:s, fx:""}; }

  // ۱۸ سؤال: برای هر ترکیب ۳ تصویر (فیلد w فقط برای بررسی داخلی است و هرگز نمایش داده نمی‌شود)
  var QUESTIONS = [
    {w:"بادکنک", a:"با", img:emo("🎈")},
    {w:"باران",  a:"با", img:emo("🌧️", "rain")},
    {w:"بادام",  a:"با", img:svg(SVG_ALMOND)},

    {w:"ببر",    a:"بَـ", img:emo("🐯")},
    {w:"بستنی",  a:"بَـ", img:emo("🍦")},
    {w:"برف",    a:"بَـ", img:emo("❄️", "snow")},

    {w:"دارو",   a:"دا", img:svg(SVG_MEDICINE)},
    {w:"دایناسور", a:"دا", img:emo("🦖")},
    {w:"دامن",   a:"دا", img:svg(SVG_SKIRT)},

    {w:"در",     a:"دَ", img:emo("🚪")},
    {w:"دست",    a:"دَ", img:emo("✋")},
    {w:"دندان",  a:"دَ", img:emo("🦷")},

    {w:"ماه",    a:"ما", img:emo("🌙")},
    {w:"ماشین",  a:"ما", img:emo("🚗")},
    {w:"مار",    a:"ما", img:emo("🐍")},

    {w:"مدرسه",  a:"مَـ", img:emo("🏫")},
    {w:"مگس",    a:"مَـ", img:svg(SVG_FLY)},
    {w:"مسجد",   a:"مَـ", img:emo("🕌")}
  ];
  /*DATA_END*/

  var TOTAL = QUESTIONS.length; // ۱۸
  var GOOD = ["آفرین! درست انتخاب کردی!", "عالی بود!", "چه خوب ترکیب رو شناختی!"];
  var BAD  = ["یک بار دیگه تلاش کن!", "دوباره فکر کن!"];

  function fa(n){ return String(n).replace(/\d/g, function(d){ return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function $(id){ return document.getElementById(id); }
  function show(id){
    var s = document.querySelectorAll(".screen");
    for (var i = 0; i < s.length; i++) s[i].classList.remove("active");
    $(id).classList.add("active");
    window.scrollTo(0, 0);
  }

  /* ---------- تصویر شهرک دوستی‌ها ---------- */
  function cloud(x, y, sc, cls){
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + sc + ')"><g class="cloud ' + cls + '" fill="#fff">' +
      '<ellipse cx="0" cy="0" rx="44" ry="15"/><circle cx="-16" cy="-12" r="16"/><circle cx="10" cy="-19" r="21"/><circle cx="32" cy="-6" r="14"/></g></g>';
  }
  function house(x, y, w, h, wall, roof, festive, smoke){
    var t = y - h, cx = x + w / 2, s = '';
    s += '<rect x="' + (x + w * 0.66) + '" y="' + (t - h * 0.66) + '" width="' + (w * 0.13) + '" height="' + (h * 0.46) + '" fill="#a1887f"/>';
    s += '<rect x="' + (x + w * 0.64) + '" y="' + (t - h * 0.7) + '" width="' + (w * 0.17) + '" height="' + (h * 0.07) + '" rx="2" fill="#6d4c41"/>';
    if (smoke) {
      for (var i = 0; i < 3; i++) {
        s += '<circle class="smoke" style="animation-delay:' + (i * 1.1) + 's" cx="' + (x + w * 0.725) + '" cy="' + (t - h * 0.72) + '" r="5" fill="#fff"/>';
      }
    }
    s += '<ellipse cx="' + cx + '" cy="' + (y + 2) + '" rx="' + (w * 0.62) + '" ry="5" fill="#000" opacity=".12"/>';
    s += '<rect x="' + x + '" y="' + t + '" width="' + w + '" height="' + h + '" rx="5" fill="' + wall + '"/>';
    s += '<polygon points="' + (x - 10) + ',' + (t + 2) + ' ' + cx + ',' + (t - h * 0.72) + ' ' + (x + w + 10) + ',' + (t + 2) + '" fill="' + roof + '"/>';
    s += '<polygon points="' + (x - 10) + ',' + (t + 2) + ' ' + cx + ',' + (t - h * 0.72) + ' ' + cx + ',' + (t + 2) + '" fill="#fff" opacity=".16"/>';
    s += '<rect x="' + (x - 10) + '" y="' + (t - 1) + '" width="' + (w + 20) + '" height="6" rx="3" fill="#000" opacity=".12"/>';

      for (var i = 0; i < 16; i++) {
        var d = document.createElement("span");
        d.className = "fx"; d.textContent = ch;
        d.style.left = (Math.random() * 92) + "%";
        d.style.fontSize = (q.img.fx === "rain" ? 1.3 : 1.6) + "rem";
        if (q.img.fx === "snow") d.style.color = "#4fc3f7";
        d.style.animationDuration = (q.img.fx === "rain" ? 0.9 + Math.random() * 0.6 : 2 + Math.random() * 1.5) + "s";
        d.style.animationDelay = (-Math.random() * 2) + "s";
        card.appendChild(d);
      }
    }
  }

  function render(){
    var q = order[idx];
    tries = 0; locked = false;
    updateStats();
    drawCard(q);
    $("msg").textContent = ""; $("msg").className = "msg";
    var box = $("options");
    box.innerHTML = "";
    buildOptions(q).forEach(function(c){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = c;
      b.addEventListener("click", function(){ answer(b, c, q); });
      box.appendChild(b);
    });
  }

  function sparks(){
    var card = $("card");
    ["⭐", "✨", "🌟", "⚡", "⭐", "✨"].forEach(function(ch, i){
      var s = document.createElement("span");
      s.className = "spark"; s.textContent = ch;
      s.style.left = (38 + Math.random() * 20) + "%";
      s.style.top = (38 + Math.random() * 20) + "%";
      var ang = (Math.PI * 2 / 6) * i;
      s.style.setProperty("--dx", Math.round(Math.cos(ang) * 110) + "px");
      s.style.setProperty("--dy", Math.round(Math.sin(ang) * 110) + "px");
      card.appendChild(s);
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1200);
    });
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  }

  function answer(btn, c, q){
    if (locked || btn.classList.contains("wrong")) return;
    var msg = $("msg");
    if (c === q.a) {
      locked = true;
      if (tries === 0) { correct++; score += 10; } else { score += 5; }
      btn.classList.add("right");
      msg.textContent = GOOD[Math.floor(Math.random() * GOOD.length)];
      msg.className = "msg good";
      sparks(); beep([660, 880, 1100]);
      $("correctNum").textContent = fa(correct);
      $("scoreNum").textContent = fa(score);
      $("bar").style.width = ((idx + 1) / TOTAL * 100) + "%";
      timer = setTimeout(function(){
        idx++;
        if (idx >= TOTAL) finish(); else render();
      }, 1500);
    } else {
      tries++;
      btn.classList.add("wrong");
      msg.textContent = BAD[Math.floor(Math.random() * BAD.length)];
      msg.className = "msg bad";
      beep([240]);
    }
  }

  function confetti(){
    var colors = ["#ffca28", "#ef5350", "#42a5f5", "#66bb6a", "#ab47bc", "#ff8f00", "#ec407a"];
    for (var i = 0; i < 70; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      c.style.animationDelay = (Math.random() * 1.5) + "s";
      c.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
      document.body.appendChild(c);
      (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 7000); })(c);
    }
  }

  function finish(){
    $("finalCorrect").textContent = fa(correct) + " از " + fa(TOTAL);
    $("finalScore").textContent = fa(score);
    var m;
    if (correct >= 16) m = "وای! تو بهترین دوست شهرک دوستی‌ها هستی! 🌟";
    else if (correct >= 12) m = "عالی بود! کلی دوست جدید پیدا کردی! 🎉";
    else if (correct >= 7) m = "خیلی خوب بود! با یه بازی دیگه حرفه‌ای‌تر می‌شی! 💪";
    else m = "آفرین که تلاش کردی! دوباره بازی کن تا دوستای بیشتری پیدا کنی! 🌱";
    $("endMsg").textContent = m;
    show("end");
    confetti(); beep([523, 659, 784, 1047]);
  }

  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
})();
</script>
</body>
</html>
